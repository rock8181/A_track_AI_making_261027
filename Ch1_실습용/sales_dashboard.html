:root{--bg:#070d1f;--pn:#0b1630;--cy:#19e3ff;--yl:#ffd426;--tx:#e6f4ff;--mut:#7f95b5;--line:rgba(25,227,255,.35);--neg:#ff5d8f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Malgun Gothic",system-ui,sans-serif}
header{padding:18px 16px 0;max-width:1280px;margin:0 auto}
.hd{background:linear-gradient(90deg,rgba(25,227,255,.18),transparent);border:1px solid var(--line);border-left:4px solid var(--yl);clip-path:polygon(0 0,100% 0,calc(100% - 28px) 100%,0 100%);padding:12px 40px 12px 18px}

.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.filters label{color:var(--mut);font-size:12px}.filters select,.seg button{background:var(--pn);color:var(--tx);border:1px solid var(--line);padding:6px 10px;font:inherit;border-radius:3px}
.seg{display:inline-flex}.seg button{border-radius:0;cursor:pointer}.seg button.on{background:var(--cy);color:#04101c;font-weight:700}
.reset{margin-left:auto;background:none;border:1px solid var(--yl);color:var(--yl);padding:6px 12px;cursor:pointer;border-radius:3px;font:inherit}
main{max-width:1280px;margin:0 auto;padding:0 16px 32px;display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.panel{background:var(--pn);border:1px solid var(--line);padding:14px;min-width:0;box-shadow:0 0 14px rgba(25,227,255,.06) inset}
.panel>h2{margin:0 0 10px;font-size:13px;color:var(--cy);letter-spacing:.06em}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s6{grid-column:span 6}.s4{grid-column:span 4}
.bar{background:rgba(255,255,255,.07);height:8px;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--yl))}
.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th,.tb td{padding:6px 8px;border-bottom:1px solid rgba(25,227,255,.15);text-align:right}.tb th:first-child,.tb td:first-child{text-align:left}.tb th{color:var(--mut);font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.err,.empty{color:var(--mut);padding:20px;text-align:center}.err{color:var(--neg)}
.note{max-width:1280px;margin:0 auto;padding:0 16px 24px;color:var(--mut);font-size:12px}
.tbl-wrap{overflow:auto;max-height:340px}
@media(max-width:900px){.s8,.s6,.s4{grid-column:span 12}.reset{margin-left:0}}

PANELS.kpi = function(items, ctx){
  if(!items || !items.length) return '<div class="empty">데이터 없음</div>';
  var total = 0, qty = 0;
  items.forEach(function(o){ total += Number(o.amount) || 0; qty += Number(o.qty) || 0; });
  var cnt = items.length;
  var avg = cnt ? Math.round(total / cnt) : 0;
  var tile = function(label, value, color){
    return '<div style="border:1px solid var(--line);padding:12px 14px;background:rgba(25,227,255,.04);min-width:0">'
      + '<div style="color:var(--mut);font-size:12px">' + ctx.esc(label) + '</div>'
      + '<div style="color:' + color + ';font-size:22px;font-weight:700;margin-top:4px;overflow-wrap:anywhere">' + ctx.esc(value) + '</div>'
      + '</div>';
  };
  return '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">'
    + tile('총매출', ctx.won(total), 'var(--yl)')
    + tile('주문 건수', cnt.toLocaleString('ko-KR') + '건', 'var(--cy)')
    + tile('평균 주문금액(객단가)', ctx.won(avg), 'var(--cy)')
    + tile('총 판매수량', qty.toLocaleString('ko-KR') + '개', 'var(--yl)')
    + '</div>';
};

PANELS.month = function(items, ctx){
  if(!items || !items.length) return '<div class="empty">데이터 없음</div>';
  var months = ['2026-01','2026-02','2026-03','2026-04','2026-05','2026-06'];
  var labels = ['1월','2월','3월','4월','5월','6월'];
  var sums = months.map(function(){ return 0; });
  items.forEach(function(o){
    var idx = months.indexOf(String(o.date || '').slice(0, 7));
    if(idx >= 0) sums[idx] += Number(o.amount) || 0;
  });
  var maxV = Math.max.apply(null, sums);
  var maxIdx = sums.indexOf(maxV);
  var W = 600, H = 260, top = 40, bottom = 34, left = 20, right = 20;
  var ph = H - top - bottom;
  var slot = (W - left - right) / months.length;
  var barW = slot * 0.55;
  var bars = '';
  sums.forEach(function(v, i){
    var h = maxV > 0 ? ph * (v / maxV) : 0;
    var x = left + i * slot + (slot - barW) / 2;
    var y = top + ph - h;
    var hi = (i === maxIdx && maxV > 0);
    var fill = hi ? '#ffd426' : '#19e3ff';
    var op = hi ? '1' : '0.55';
    var cx = x + barW / 2;
    bars += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + h.toFixed(1) + '" fill="' + fill + '" fill-opacity="' + op + '"/>';
    bars += '<text x="' + cx.toFixed(1) + '" y="' + (y - 6).toFixed(1) + '" text-anchor="middle" font-size="13" fill="' + (hi ? '#ffd426' : '#e6f4ff') + '"' + (hi ? ' font-weight="700"' : '') + '>' + ctx.esc(ctx.short(v)) + '</text>';
    bars += '<text x="' + cx.toFixed(1) + '" y="' + (H - 12) + '" text-anchor="middle" font-size="12" fill="#7f95b5">' + ctx.esc(labels[i]) + '</text>';
  });
  var base = '<line x1="' + left + '" y1="' + (top + ph) + '" x2="' + (W - right) + '" y2="' + (top + ph) + '" stroke="rgba(25,227,255,.35)" stroke-width="1"/>';
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto" role="img" aria-label="월별 매출 막대 차트">' + base + bars + '</svg>';
  var note = maxV > 0
    ? '<div style="color:var(--mut);font-size:12px;margin-top:6px">최고 월: <span style="color:var(--yl)">' + ctx.esc(labels[maxIdx]) + '</span> ' + ctx.esc(ctx.won(maxV)) + '</div>'
    : '<div style="color:var(--mut);font-size:12px;margin-top:6px">해당 기간 매출 없음</div>';
  return svg + note;
};

PANELS.region = function(items, ctx){
  if(!items || !items.length) return '<div class="empty">데이터 없음</div>';
  const g = ctx.groupSum(items, 'region');
  const total = items.reduce((a, o) => a + (Number(o.amount) || 0), 0);
  const max = g.length ? g[0].sum : 0;
  return g.map(r => {
    const w = max ? (r.sum / max * 100).toFixed(1) : '0';
    return '<div style="margin:8px 0">'
      + '<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">'
      + '<span>' + ctx.esc(r.k) + '</span>'
      + '<span>' + ctx.won(r.sum) + ' · ' + ctx.pct(r.sum, total) + '</span></div>'
      + '<div class="bar"><i style="width:' + w + '%"></i></div></div>';
  }).join('');
};

PANELS.product = function(items, ctx){
  if(!items || !items.length) return '<div class="empty">데이터 없음</div>';
  const fmt = n => Number(n || 0).toLocaleString('ko-KR');
  const g = ctx.groupSum(items, 'product');
  const total = items.reduce((a, o) => a + (Number(o.amount) || 0), 0);
  const max = g.length ? g[0].sum : 0;
  const bars = g.map((r, i) => {
    const color = ctx.COLORS[i % ctx.COLORS.length];
    const w = max ? (r.sum / max * 100).toFixed(1) : '0';
    return '<div style="margin:6px 0">'
      + '<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">'
      + '<span><span class="dot" style="background:' + color + '"></span>' + ctx.esc(r.k) + '</span>'
      + '<span>' + ctx.won(r.sum) + '</span></div>'
      + '<div class="bar"><i style="width:' + w + '%;background:' + color + '"></i></div></div>';
  }).join('');
  const rows = g.map((r, i) => {
    const color = ctx.COLORS[i % ctx.COLORS.length];
    return '<tr><td><span class="dot" style="background:' + color + '"></span>' + (i + 1) + '. ' + ctx.esc(r.k) + '</td>'
      + '<td>' + fmt(r.qty) + '</td>'
      + '<td>' + ctx.won(r.sum) + '</td>'
      + '<td>' + ctx.pct(r.sum, total) + '</td></tr>';
  }).join('');
  return bars
    + '<div class="tbl-wrap" style="margin-top:12px"><table class="tb">'
    + '<tr><th>제품</th><th>판매수량</th><th>매출</th><th>비중</th></tr>'
    + rows + '</table></div>';
};

PANELS.rep = function(items, ctx){
 if(!items||!items.length)return '<div class="empty">데이터 없음</div>';
 const total=items.reduce((a,o)=>a+(o.amount||0),0);
 const g=ctx.groupSum(items,'rep');
 const max=g.length?g[0].sum:0;
 const rows=g.map((r,i)=>{
  const w=max?(r.sum/max*100):0;
  const hi=i===0?' style="color:var(--yl);font-weight:700"':'';
  return '<tr><td'+hi+'>'+(i===0?'1위 ':'')+ctx.esc(r.k)+'</td>'+
   '<td'+hi+'>'+r.cnt+'건</td>'+
   '<td'+hi+'>'+ctx.esc(r.qty)+'</td>'+
   '<td'+hi+'>'+ctx.won(r.sum)+'</td>'+
   '<td'+hi+'>'+ctx.pct(r.sum,total)+'</td>'+
   '<td style="width:30%"><div class="bar"><i style="width:'+w.toFixed(1)+'%"></i></div></td></tr>';
 }).join('');
 return '<div class="tbl-wrap"><table class="tb"><tr><th>담당자</th><th>주문수</th><th>판매수량</th><th>매출</th><th>비중</th><th>막대</th></tr>'+rows+'</table></div>';
};

PANELS.channel = function(items, ctx){
 if(!items||!items.length)return '<div class="empty">데이터 없음</div>';
 const esc=ctx.esc;
 const total=items.reduce((a,o)=>a+(o.amount||0),0);
 const map={};
 ctx.groupSum(items,'channel').forEach(g=>{map[g.k]=g});
 const keys=['온라인','오프라인'];
 Object.keys(map).forEach(k=>{if(keys.indexOf(k)<0)keys.push(k)});
 const R=15.9155;
 let offset=25, segs='', legend='';
 keys.forEach((k,i)=>{
  const g=map[k]||{sum:0,cnt:0,qty:0};
  const share=total?g.sum/total*100:0;
  const color=ctx.COLORS[i%ctx.COLORS.length];
  segs+='<circle cx="21" cy="21" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="6" stroke-dasharray="'+share.toFixed(3)+' '+(100-share).toFixed(3)+'" stroke-dashoffset="'+offset.toFixed(3)+'"></circle>';

  legend+='<div style="margin:8px 0"><span class="dot" style="background:'+color+'"></span><b>'+esc(k)+'</b> &nbsp; '+ctx.won(g.sum)+

 });
 const svg='<svg viewBox="0 0 42 42" style="width:100%;max-width:220px;height:auto">'+
  '<circle cx="21" cy="21" r="'+R+'" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="6"></circle>'+

 return '<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center">'+
  '<div style="flex:0 1 220px;min-width:160px">'+svg+'</div>'+
  '<div style="flex:1 1 160px;min-width:160px">'+legend+'</div></div>';
};

const COLORS=['#19e3ff','#ffd426','#ff5d8f','#7cf29a','#b48cff','#ff9f43','#4d9bff','#e0e6ff'];
const ctx={esc,won,short,pct,groupSum,COLORS};
const LAYOUT=[['kpi','s12','핵심 지표'],['month','s8','월별 매출 추이'],['channel','s4','채널별 매출'],['region','s6','지역별 매출'],['product','s6','제품별 매출'],['rep','s12','담당자별 실적'],['orders','s12','주문 내역']];
PANELS.orders=function(items,c){
 if(!items.length)return '<div class="empty">데이터 없음</div>';
 const rows=items.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.amount-a.amount).map(o=>'<tr><td>'+c.esc(o.id)+'</td><td>'+c.esc(o.date)+'</td><td>'+c.esc(o.region)+'</td><td>'+c.esc(o.rep)+'</td><td>'+c.esc(o.channel)+'</td><td>'+c.esc(o.product)+'</td><td>'+c.esc(o.qty)+'</td><td>'+c.won(o.amount)+'</td></tr>').join('');
 return '<div class="tbl-wrap"><table class="tb"><tr><th>주문번호</th><th>일자</th><th>지역</th><th>담당자</th><th>채널</th><th>제품</th><th>수량</th><th>매출액</th></tr>'+rows+'</table></div>';
};
const all=DATA.map(r=>({id:r['주문번호'],date:r['주문일자'],region:r['지역'],rep:r['담당자'],channel:r['채널'],product:r['제품'],price:r['단가'],qty:r['수량'],amount:r['매출액']}));
const uniq=k=>[...new Set(all.map(o=>o[k]))].sort();
const st={region:'',product:'',channel:''};
const opt=(k,l)=>'<label>'+l+' <select data-k="'+k+'"><option value="">전체</option>'+uniq(k).map(v=>'<option>'+esc(v)+'</option>').join('')+'</select></label>';
document.getElementById('filters').innerHTML=opt('region','지역')+opt('product','제품')+
 '<span class="seg" id="seg">'+['','온라인','오프라인'].map(v=>'<button data-v="'+v+'">'+(v||'전체 채널')+'</button>').join('')+'</span><button class="reset" id="rs">초기화</button>';
document.getElementById('main').innerHTML=LAYOUT.map(l=>'<section class="panel '+l[1]+'"><h2>'+l[2]+'</h2><div id="p_'+l[0]+'"></div></section>').join('');
function render(){
 const items=all.filter(o=>(!st.region||o.region===st.region)&&(!st.product||o.product===st.product)&&(!st.channel||o.channel===st.channel));
 const ds=all.map(o=>o.date).sort();
 document.getElementById('sub').textContent=items.length+'건 / '+won(items.reduce((a,o)=>a+o.amount,0))+(ds.length?' · 기간 '+ds[0]+' ~ '+ds[ds.length-1]:'');
 document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===st.channel));
 document.querySelectorAll('#filters select').forEach(s=>s.value=st[s.dataset.k]);
 LAYOUT.forEach(l=>{const el=document.getElementById('p_'+l[0]);try{if(typeof PANELS[l[0]]!=='function')throw 0;el.innerHTML=PANELS[l[0]](items,ctx)}catch(e){el.innerHTML='<div class="err">로드 실패</div>'}});
}
document.getElementById('filters').addEventListener('change',e=>{if(e.target.dataset.k){st[e.target.dataset.k]=e.target.value;render()}});
document.getElementById('seg').addEventListener('click',e=>{if(e.target.dataset.v!==undefined){st.channel=e.target.dataset.v;render()}});
document.getElementById('rs').onclick=()=>{st.region=st.product=st.channel='';render()};
render();
})();
</script></body></html>
